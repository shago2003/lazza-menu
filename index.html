<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lazza — menyu</title>
<meta name="description" content="Lazza kafesinin menyusu: burgerlər, kartof fri, qəhvə və içkilər. Sifarişi yığın və WhatsApp-a göndərin.">
<meta name="theme-color" content="#16100d">
<meta name="format-detection" content="telephone=no">

<meta property="og:title" content="Lazza — burgerlər və qəhvə">
<meta property="og:description" content="Menyudan sifarişi yığın və bizə WhatsApp-a göndərin.">
<meta property="og:image" content="images/hero.jpg">
<meta property="og:type" content="website">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2316100d'/><text x='50' y='72' font-size='62' font-family='sans-serif' font-weight='bold' fill='%23e9a23b' text-anchor='middle'>L</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ================= ИКОНКИ ================= -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></symbol>

  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.14-.14.3-.35.45-.53.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.53-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.06 2.87 1.21 3.07.15.2 2.09 3.2 5.07 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35zM12.05 21.5h-.02a9.4 9.4 0 01-4.79-1.31l-.34-.2-3.56.93.95-3.47-.22-.36a9.37 9.37 0 01-1.44-5.01c0-5.18 4.22-9.4 9.42-9.4a9.35 9.35 0 016.65 2.76 9.32 9.32 0 012.75 6.65c0 5.18-4.22 9.4-9.4 9.4zM20.46 3.53A11.72 11.72 0 0012.05 0C5.57 0 .3 5.27.3 11.75c0 2.07.54 4.09 1.57 5.87L.2 24l6.53-1.71a11.7 11.7 0 005.32 1.29h.01c6.48 0 11.75-5.27 11.75-11.75 0-3.14-1.22-6.09-3.35-8.3z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.35 6.19 20.4 7.3 13.93 2.6 9.35l6.5-.95L12 2.5z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5.5-8 12-8 12s-8-6.5-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.9"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 16.9v2.6a1.7 1.7 0 01-1.9 1.7 17 17 0 01-7.4-2.6 16.6 16.6 0 01-5.1-5.1A17 17 0 014.5 6a1.7 1.7 0 011.7-1.9h2.6a1.7 1.7 0 011.7 1.5c.1.9.3 1.7.6 2.5a1.7 1.7 0 01-.4 1.8l-1.1 1.1a13.6 13.6 0 005.1 5.1l1.1-1.1a1.7 1.7 0 011.8-.4c.8.3 1.6.5 2.5.6a1.7 1.7 0 011.5 1.7z"/></symbol>
  <symbol id="i-insta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.6 8.6 0 019.8 3.5a8.7 8.7 0 102 17.1 8.7 8.7 0 008.7-6.4z"/></symbol>
  <symbol id="i-cube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.9l8 4.35v9.5L12 21.1l-8-4.35v-9.5L12 2.9z"/><path d="M4 7.25l8 4.35 8-4.35M12 11.6v9.5"/></symbol>
  <symbol id="i-ar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.6V5.7A2.7 2.7 0 015.7 3h2.9M15.4 3h2.9A2.7 2.7 0 0121 5.7v2.9M21 15.4v2.9a2.7 2.7 0 01-2.7 2.7h-2.9M8.6 21H5.7A2.7 2.7 0 013 18.3v-2.9"/><path d="M12 8.4l3.5 2v4l-3.5 2-3.5-2v-4l3.5-2z"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></symbol>
</svg>

<!-- ================= ШАПКА ================= -->
<header class="hero">
  <img class="hero__bg" src="images/hero.jpg" alt="" fetchpriority="high">

  <div class="hero__top">
    <span id="tableTag">Menyu</span>
    <div class="hero__tools">
      <button class="skin" id="skinToggle" type="button"><svg><use href="#i-sun"/></svg></button>
      <div class="langs" id="langs" role="group" aria-label="Dil / Язык / Language"></div>
    </div>
  </div>

  <div class="wrap">
    <h1 class="hero__logo">LA<em>ZZ</em>A</h1>
    <p class="hero__tagline" id="tagline"></p>

    <div class="hero__meta">
      <a class="chip chip--accent" id="phoneChip" href="#">
        <svg><use href="#i-phone"/></svg><span id="phoneText"></span>
      </a>
      <a class="chip chip--accent" id="instaChip" href="#" target="_blank" rel="noopener">
        <svg><use href="#i-insta"/></svg><span id="instaText"></span>
      </a>
      <a class="chip" id="addressChip" href="#" target="_blank" rel="noopener">
        <svg><use href="#i-pin"/></svg><span id="addressText"></span>
      </a>
      <span class="chip chip--status" id="statusLine">
        <span class="status__dot"></span><span id="statusText"></span>
      </span>
    </div>

    <a class="hero__scroll" href="#burgers">
      <span id="scrollHint"></span>
      <span aria-hidden="true">↓</span>
    </a>
  </div>
</header>

<!-- ================= НАВИГАЦИЯ ================= -->
<nav class="nav" aria-label="Menyu">
  <div class="nav__scroll" id="navScroll"></div>
</nav>

<!-- ================= МЕНЮ ================= -->
<main class="wrap" id="menuRoot"></main>

<!-- ================= ОТЗЫВЫ ================= -->
<section class="reviews wrap" id="reviews">
  <div class="reviews__head">
    <div>
      <p class="section__eyebrow" id="reviewsEyebrow"></p>
      <h2 class="section__title" id="reviewsTitle"></h2>
      <div class="rating">
        <span class="rating__score" id="ratingScore">0,0</span>
        <span>
          <span class="stars" id="ratingStars"></span>
          <span class="rating__meta" id="ratingMeta"></span>
        </span>
      </div>
    </div>
  </div>

  <div class="review-list" id="reviewList"></div>

  <p class="reviews__cta">
    <button class="btn-ghost" id="openReview" type="button">
      <svg><use href="#i-pen"/></svg>
      <span id="openReviewText"></span>
    </button>
  </p>
</section>

<!-- ================= ПОДВАЛ ================= -->
<footer class="footer">
  <div class="wrap">
    <div class="footer__grid">
      <div>
        <p class="footer__logo">LA<em>ZZ</em>A</p>
        <div class="footer__tools">
          <button class="skin" id="skinToggleFoot" type="button"><svg><use href="#i-sun"/></svg></button>
          <div class="langs langs--foot" id="langsFoot" role="group" aria-label="Dil / Язык / Language"></div>
        </div>
      </div>
      <div>
        <h3 id="footWhere"></h3>
        <a id="footAddress" href="#" target="_blank" rel="noopener"></a>
        <p id="footHours"></p>
      </div>
      <div>
        <h3 id="footContact"></h3>
        <a id="footPhone" href="#"></a>
        <a id="footWa" href="#" target="_blank" rel="noopener"></a>
        <a id="footInsta" href="#" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <p class="footer__note" id="footNote"></p>

    <!-- Указание авторов 3D-моделей: этого требует лицензия CC BY -->
    <p class="footer__credit">
      3D:
      <a href="https://kenney.nl/assets/food-kit" target="_blank" rel="noopener">Kenney</a> (CC0),
      <a href="https://sketchfab.com/3d-models/big-mac-7aeeaa237c6a48c39d0aeef7fc845ecb" target="_blank" rel="noopener">Aaron Theesfeld</a> (CC BY)
    </p>
  </div>
</footer>

<!-- ================= ПЛАВАЮЩАЯ КОРЗИНА ================= -->
<div class="bar" id="cartBar">
  <button class="bar__btn" id="cartBtn" type="button">
    <span class="bar__count" id="cartCount">0</span>
    <span class="bar__label" id="cartLabel"></span>
    <span class="bar__sum" id="cartSum"></span>
  </button>
</div>

<div class="scrim" id="scrim"></div>

<!-- ================= ЛИСТ: БЛЮДО ================= -->
<div class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="detailName" hidden>
  <div class="sheet__panel">
    <div class="sheet__scroll">
      <div class="detail__media">
        <img id="detailImg" src="" alt="">

        <!-- 3D-модель блюда; наполняется из ar.js только по нажатию гостя -->
        <div class="ar" id="arStage" hidden></div>
        <button class="ar-toggle" id="arToggle" type="button" hidden>
          <svg aria-hidden="true"><use href="#i-cube"/></svg>
          <span id="arToggleText"></span>
        </button>

        <button class="sheet__close" data-close type="button" aria-label="✕">
          <svg><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="detail__body">
        <h2 class="detail__name" id="detailName"></h2>
        <p class="detail__desc" id="detailDesc"></p>
        <div class="detail__facts" id="detailFacts"></div>
        <div id="detailMods"></div>
      </div>
    </div>
    <div class="sheet__foot">
      <div class="qty">
        <button type="button" id="qtyMinus" aria-label="−"><svg><use href="#i-minus"/></svg></button>
        <span class="qty__n" id="qtyN">1</span>
        <button type="button" id="qtyPlus" aria-label="+"><svg><use href="#i-plus"/></svg></button>
      </div>
      <button class="btn" id="detailAdd" type="button">
        <span id="detailAddText"></span> · <span id="detailSum"></span>
      </button>
    </div>
  </div>
</div>

<!-- ================= ЛИСТ: КОРЗИНА-ЧЕК ================= -->
<div class="sheet receipt-sheet" id="cartSheet" role="dialog" aria-modal="true" aria-labelledby="receiptTitle" hidden>
  <div class="sheet__panel">
    <div class="sheet__scroll">
      <div class="receipt">
        <div class="receipt__edge"></div>
        <button class="sheet__close sheet__close--paper" data-close type="button" aria-label="✕">
          <svg><use href="#i-close"/></svg>
        </button>
        <div class="receipt__inner">
          <div class="receipt__head">
            <p class="receipt__logo" id="receiptTitle">LAZZA</p>
            <p class="receipt__sub" id="receiptSub"></p>
          </div>

          <div class="receipt__meta">
            <span id="receiptNo">№ —</span>
            <span id="receiptDate"></span>
          </div>

          <hr class="receipt__rule receipt__rule--double">

          <div id="receiptItems"></div>

          <div id="receiptTotals" hidden>
            <hr class="receipt__rule">
            <div class="rtotal"><span class="rtotal__label" id="tPositionsLabel"></span><span class="rtotal__val" id="tPositions"></span></div>
            <div class="rtotal"><span class="rtotal__label" id="tSubtotalLabel"></span><span class="rtotal__val" id="tSubtotal"></span></div>
            <div class="rtotal" id="tDeliveryRow" hidden><span class="rtotal__label" id="tDeliveryLabel"></span><span class="rtotal__val" id="tDelivery"></span></div>
            <hr class="receipt__rule receipt__rule--double">
            <div class="rtotal rtotal--grand"><span class="rtotal__label" id="tGrandLabel"></span><span class="rtotal__val" id="tGrand"></span></div>
          </div>

          <div id="receiptForm" hidden>
            <hr class="receipt__rule">

            <div class="field" style="margin-top:0">
              <label id="howToGet"></label>
              <div class="segs" role="group">
                <button class="seg" type="button" data-mode="table" aria-pressed="true"></button>
                <button class="seg" type="button" data-mode="pickup" aria-pressed="false"></button>
                <button class="seg" type="button" data-mode="delivery" aria-pressed="false"></button>
              </div>
            </div>

            <div class="field" id="fTable">
              <label for="iTable"></label>
              <input id="iTable" type="number" inputmode="numeric" min="1">
              <span class="field__err"></span>
            </div>

            <div class="field" id="fAddress" hidden>
              <label for="iAddress"></label>
              <input id="iAddress" type="text" autocomplete="street-address">
              <span class="field__err"></span>
            </div>

            <div class="field" id="fName">
              <label for="iName"></label>
              <input id="iName" type="text" autocomplete="given-name">
              <span class="field__err"></span>
            </div>

            <div class="field" id="fPhone" hidden>
              <label for="iPhone"></label>
              <input id="iPhone" type="tel" inputmode="tel" autocomplete="tel">
              <span class="field__err"></span>
            </div>

            <div class="field" id="fNote">
              <label for="iNote"></label>
              <textarea id="iNote"></textarea>
            </div>

            <p class="hint" id="orderHint"></p>
          </div>
        </div>

        <div class="receipt__foot" id="receiptFoot" hidden>
          <button class="btn btn--wa" id="sendOrder" type="button">
            <svg><use href="#i-wa"/></svg>
            <span id="sendOrderText"></span>
          </button>
          <div class="barcode" id="barcode" aria-hidden="true"></div>
          <p class="receipt__id" id="barcodeId"></p>
        </div>

        <div class="receipt__edge receipt__edge--bottom"></div>
      </div>
    </div>
  </div>
</div>

<!-- ================= ЛИСТ: ОТЗЫВ ================= -->
<div class="sheet form-sheet" id="reviewSheet" role="dialog" aria-modal="true" aria-labelledby="reviewTitle" hidden>
  <div class="sheet__panel">
    <div class="sheet__grip"></div>
    <div class="sheet__scroll">
      <button class="sheet__close" data-close type="button" aria-label="✕">
        <svg><use href="#i-close"/></svg>
      </button>
      <h2 class="form-title" id="reviewTitle"></h2>
      <p class="form-sub" id="reviewSub"></p>

      <div class="field" style="margin-top:0">
        <label id="fRatingLabel"></label>
        <div class="starpick" id="starPick" role="group"></div>
      </div>

      <div class="field" id="fRName">
        <label for="iRName"></label>
        <input id="iRName" type="text" autocomplete="given-name">
        <span class="field__err"></span>
      </div>

      <div class="field" id="fRText">
        <label for="iRText"></label>
        <textarea id="iRText" rows="4"></textarea>
        <span class="field__err"></span>
      </div>
    </div>
    <div class="sheet__foot">
      <button class="btn btn--wa" id="sendReview" type="button">
        <svg><use href="#i-wa"/></svg>
        <span id="sendReviewText"></span>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="menu.js"></script>
<script src="ar.js"></script>
<script src="app.js"></script>
</body>
</html>
